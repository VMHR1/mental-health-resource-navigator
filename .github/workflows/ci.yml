name: CI

on:
  pull_request:
    branches: [updated-main]
  push:
    branches: [updated-main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Verify (build, validate, test, audit)
        run: npm run verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

# Note: this workflow deliberately does NOT regenerate snapshots.
# It previously carried an `update-snapshots` job that ran the entire
# Playwright suite a second time on every push and PR, purely to upload a
# 7-day artifact that nothing consumed — doubling CI compute for no signal.
# Regenerating baselines on demand belongs to update-playwright-snapshots.yml,
# which does the same run and commits the result back.

