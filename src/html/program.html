    .program-detail-header {

      padding: 24px;
      margin-bottom: 24px;

    .program-detail-title {
      font-size: 28px;
      font-weight: 950;
      margin: 0 0 8px;
    }
    .program-detail-org {

      color: var(--muted);
      margin: 0 0 16px;
    }
    .program-detail-badges {
      display: flex;

    .program-detail-section {

      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .program-detail-label {
      font-weight: 700;
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .program-detail-value {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.6;
    }
    .related-programs {
      margin-top: 32px;
    }
    .related-programs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    @media (max-width: 768px) {
      .program-detail-grid {
        grid-template-columns: 1fr;
      }
      .program-detail-label {
